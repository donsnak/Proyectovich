<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CAMISOVICH</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#0f0f0f;
    color:white;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#111;
    border-bottom:1px solid #222;
}

.navbar{
    max-width:1400px;
    margin:auto;
    padding:18px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:1.8rem;
    font-weight:700;
}

.logo span{
    color:#00ff88;
}

nav{
    display:flex;
    gap:25px;
}

nav a{
    text-decoration:none;
    color:white;
    transition:0.3s;
}

nav a:hover{
    color:#00ff88;
}

/* CARRITO */

.cart-icon{
    position:relative;
    cursor:pointer;
    font-size:1.3rem;
}

.cart-count{
    position:absolute;
    top:-10px;
    right:-10px;
    background:#00ff88;
    color:black;
    width:20px;
    height:20px;
    border-radius:50%;
    font-size:0.8rem;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:700;
}

/* HERO */

.hero{
    height:70vh;
    background:
    linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.7)),
    url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=1400&auto=format&fit=crop');

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero h1{
    font-size:4rem;
}

.hero p{
    margin-top:15px;
    color:#ccc;
}

.hero button{
    margin-top:25px;
    padding:14px 35px;
    border:none;
    border-radius:50px;
    background:#00ff88;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

.hero button:hover{
    transform:scale(1.05);
}

/* SEARCH */

.search-box{
    max-width:500px;
    margin:50px auto 20px;
    padding:0 20px;
}

.search-box input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#1a1a1a;
    color:white;
    outline:none;
    font-size:1rem;
}

/* TITULO */

.section-title{
    text-align:center;
    font-size:2.5rem;
    margin:40px 0;
}

/* PRODUCTOS */

.products{
    max-width:1400px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:30px;
    padding:20px;
}

.card{
    background:#181818;
    border-radius:25px;
    overflow:hidden;
    transition:0.4s;
    border:1px solid #222;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 20px 40px rgba(0,0,0,0.4);
}

.card img{
    width:100%;
    height:320px;
    object-fit:cover;
}

.card-content{
    padding:20px;
}

.card h3{
    margin-bottom:10px;
}

.price{
    color:#00ff88;
    font-size:1.3rem;
    font-weight:700;
    margin-bottom:15px;
}

.sizes{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.sizes span{
    border:1px solid #444;
    padding:5px 10px;
    border-radius:10px;
    font-size:0.8rem;
}

.buy-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:14px;
    background:white;
    color:black;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

.buy-btn:hover{
    background:#00ff88;
}

/* PANEL CARRITO */

.cart-panel{
    position:fixed;
    right:-400px;
    top:0;
    width:350px;
    height:100%;
    background:#151515;
    border-left:1px solid #222;
    padding:20px;
    transition:0.4s;
    z-index:2000;
    overflow-y:auto;
}

.cart-panel.active{
    right:0;
}

.cart-item{
    margin:15px 0;
    padding:10px;
    border-bottom:1px solid #333;
}

.total{
    font-size:1.3rem;
    margin-top:20px;
    color:#00ff88;
    font-weight:700;
}

.whatsapp-btn{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    border-radius:15px;
    background:#25D366;
    color:white;
    font-weight:700;
    cursor:pointer;
}

footer{
    margin-top:80px;
    padding:40px;
    text-align:center;
    border-top:1px solid #222;
    color:#aaa;
}

/* RESPONSIVE */

@media(max-width:768px){

.hero h1{
    font-size:2.5rem;
}

nav{
    display:none;
}

}

</style>
</head>

<body>

<header>

<div class="navbar">

<div class="logo">
CAMISO<span>VICH</span>
</div>

<nav>
<a href="#">Inicio</a>
<a href="#catalogo">Catálogo</a>
<a href="#">Ofertas</a>
</nav>

<div class="cart-icon" onclick="toggleCart()">
🛒
<div class="cart-count" id="cart-count">0</div>
</div>

</div>

</header>

<!-- HERO -->

<section class="hero">

<div>

<h1>Camisas de Fútbol</h1>
<p>La tienda más elegante para fanáticos del fútbol</p>

<button onclick="document.getElementById('catalogo').scrollIntoView({behavior:'smooth'})">
Ver catálogo
</button>

</div>

</section>

<!-- BUSCADOR -->

<div class="search-box">
<input type="text" id="searchInput" placeholder="Buscar equipo...">
</div>

<h2 class="section-title" id="catalogo">Destacados</h2>

<!-- PRODUCTOS -->

<section class="products" id="product-list">

<div class="card" data-name="Barcelona">

<img src="Barca1.png">

<div class="card-content">

<h3>Barcelona 24/25</h3>
<div class="price">$799 MXN</div>

<div class="sizes">
<span>S</span>
<span>M</span>
<span>L</span>
<span>XL</span>
</div>

<button class="buy-btn"
onclick="addToCart('Barcelona 24/25',799)">
Agregar al carrito
</button>

</div>
</div>

<div class="card" data-name="Real Madrid">

<img src="Real1.png">

<div class="card-content">

<h3>Real Madrid 24/25</h3>
<div class="price">$799 MXN</div>

<div class="sizes">
<span>S</span>
<span>M</span>
<span>L</span>
<span>XL</span>
</div>

<button class="buy-btn"
onclick="addToCart('Real Madrid 24/25',799)">
Agregar al carrito
</button>

</div>
</div>

<div class="card" data-name="Liverpool">

<img src="r1.png">

<div class="card-content">

<h3>Liverpool 24/25</h3>
<div class="price">$799 MXN</div>

<div class="sizes">
<span>S</span>
<span>M</span>
<span>L</span>
<span>XL</span>
</div>

<button class="buy-btn"
onclick="addToCart('Liverpool 24/25',799)">
Agregar al carrito
</button>

</div>
</div>

</section>

<!-- PANEL CARRITO -->

<div class="cart-panel" id="cartPanel">

<h2>Tu carrito</h2>

<div id="cart-items"></div>

<div class="total" id="total">
Total: $0 MXN
</div>

<button class="whatsapp-btn" onclick="sendWhatsApp()">
Finalizar pedido por WhatsApp
</button>

</div>

<footer>
© 2026 CAMISOVICH
</footer>

<script>

let cart = [];

function addToCart(name, price){

cart.push({name, price});

updateCart();

}

function updateCart(){

const cartItems = document.getElementById("cart-items");

cartItems.innerHTML = "";

let total = 0;

cart.forEach((item,index)=>{

total += item.price;

cartItems.innerHTML += `

<div class="cart-item">
${item.name} - $${item.price} MXN
</div>

`;

});

document.getElementById("total").innerText =
`Total: $${total} MXN`;

document.getElementById("cart-count").innerText =
cart.length;

}

function toggleCart(){

document.getElementById("cartPanel")
.classList.toggle("active");

}

/* WHATSAPP */

function sendWhatsApp(){

if(cart.length === 0){

alert("El carrito está vacío");

return;

}

let message = "Hola, quiero pedir:%0A";

let total = 0;

cart.forEach(item=>{

message += `- ${item.name} $${item.price} MXN%0A`;

total += item.price;

});

message += `%0ATotal: $${total} MXN`;

window.open(
`https://wa.me/5210000000000?text=${message}`,
'_blank'
);

}

/* BUSCADOR */

const searchInput =
document.getElementById("searchInput");

searchInput.addEventListener("keyup", ()=>{

const value =
searchInput.value.toLowerCase();

const cards =
document.querySelectorAll(".card");

cards.forEach(card=>{

const name =
card.dataset.name.toLowerCase();

card.style.display =
name.includes(value)
? "block"
: "none";

});

});

</script>

</body>
</html>
