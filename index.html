<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CAMISOVICH</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   GENERAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#0f0f0f;
    color:white;
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#111;
    border-bottom:1px solid #222;
}

.navbar{
    max-width:1400px;
    margin:auto;
    padding:18px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:1.8rem;
    font-weight:700;
}

.logo span{
    color:#00ff88;
}

nav{
    display:flex;
    gap:25px;
}

nav a{
    text-decoration:none;
    color:white;
    transition:0.3s;
}

nav a:hover{
    color:#00ff88;
}

/* =========================
   CARRITO ICONO
========================= */

.cart-icon{
    position:relative;
    cursor:pointer;
    font-size:1.5rem;
}

.cart-count{
    position:absolute;
    top:-10px;
    right:-10px;
    background:#00ff88;
    color:black;
    width:22px;
    height:22px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:0.75rem;
    font-weight:700;
}

/* =========================
   HERO
========================= */

.hero{
    height:70vh;

    background:
    linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.7)),
    url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=1400&auto=format&fit=crop');

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.hero h1{
    font-size:4rem;
}

.hero p{
    color:#ccc;
    margin-top:15px;
}

.hero button{
    margin-top:25px;
    padding:14px 35px;
    border:none;
    border-radius:50px;
    background:#00ff88;
    color:black;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

.hero button:hover{
    transform:scale(1.05);
}

/* =========================
   BUSCADOR
========================= */

.search-box{
    max-width:500px;
    margin:50px auto 20px;
    padding:0 20px;
}

.search-box input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#1a1a1a;
    color:white;
    outline:none;
    font-size:1rem;
}

/* =========================
   TITULOS
========================= */

.section-title{
    text-align:center;
    font-size:2.5rem;
    margin:40px 0;
}

/* =========================
   PRODUCTOS
========================= */

.products{
    max-width:1400px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:30px;
    padding:20px;
}

.card{
    background:#181818;
    border-radius:25px;
    overflow:hidden;
    border:1px solid #222;
    transition:0.4s;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 20px 40px rgba(0,0,0,0.4);
}

.card img{
    width:100%;
    height:320px;
    object-fit:cover;
}

.card-content{
    padding:20px;
}

.card h3{
    margin-bottom:10px;
}

.price{
    color:#00ff88;
    font-size:1.3rem;
    font-weight:700;
    margin-bottom:15px;
}

/* =========================
   TALLAS
========================= */

.sizes{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.size-btn{
    border:1px solid #444;
    background:transparent;
    color:white;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}

.size-btn:hover{
    border-color:#00ff88;
    color:#00ff88;
}

.size-btn.active{
    background:#00ff88;
    color:black;
    border-color:#00ff88;
}

/* =========================
   BOTON COMPRAR
========================= */

.buy-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:14px;
    background:white;
    color:black;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

.buy-btn:hover{
    background:#00ff88;
}

/* =========================
   PANEL CARRITO
========================= */

.cart-panel{
    position:fixed;
    top:0;
    right:-420px;
    width:380px;
    height:100%;
    background:#151515;
    border-left:1px solid #222;
    z-index:2000;
    transition:0.4s;
    overflow-y:auto;
    padding:25px;
}

.cart-panel.active{
    right:0;
}

.cart-panel h2{
    margin-bottom:25px;
}

.cart-item{
    background:#1c1c1c;
    border:1px solid #2a2a2a;
    border-radius:18px;
    padding:15px;
    margin-bottom:15px;
}

.cart-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.remove-btn{
    background:#222;
    color:white;
    border:none;
    width:35px;
    height:35px;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}

.remove-btn:hover{
    background:red;
}

/* =========================
   CANTIDAD
========================= */

.quantity-controls{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:15px;
}

.qty-btn{
    width:30px;
    height:30px;
    border:none;
    border-radius:8px;
    background:#00ff88;
    color:black;
    font-weight:700;
    cursor:pointer;
}

/* =========================
   TOTAL
========================= */

.total{
    font-size:1.4rem;
    margin-top:20px;
    color:#00ff88;
    font-weight:700;
}

/* =========================
   BOTONES CARRITO
========================= */

.cart-buttons{
    display:flex;
    flex-direction:column;
    gap:15px;
    margin-top:25px;
}

.clear-btn{
    padding:14px;
    border:none;
    border-radius:14px;
    background:#222;
    color:white;
    font-weight:700;
    cursor:pointer;
}

.whatsapp-btn{
    padding:14px;
    border:none;
    border-radius:14px;
    background:#25D366;
    color:white;
    font-weight:700;
    cursor:pointer;
}

/* =========================
   FOOTER
========================= */

footer{
    margin-top:80px;
    padding:40px;
    text-align:center;
    color:#888;
    border-top:1px solid #222;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:768px){

.hero h1{
    font-size:2.5rem;
}

nav{
    display:none;
}

.cart-panel{
    width:100%;
}

}

</style>

</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

<div class="navbar">

<div class="logo">
CAMISO<span>VICH</span>
</div>

<nav>
<a href="#">Inicio</a>
<a href="#catalogo">Catálogo</a>
<a href="#">Ofertas</a>
</nav>

<div class="cart-icon" onclick="toggleCart()">

🛒

<div class="cart-count" id="cart-count">
0
</div>

</div>

</div>

</header>

<!-- =========================
     HERO
========================= -->

<section class="hero">

<div>

<h1>Camisas de Fútbol</h1>

<p>
La tienda más elegante para fanáticos del fútbol
</p>

<button onclick="document.getElementById('catalogo').scrollIntoView({behavior:'smooth'})">
Ver catálogo
</button>

</div>

</section>

<!-- =========================
     BUSCADOR
========================= -->

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Buscar equipo..."
>

</div>

<h2 class="section-title" id="catalogo">
Destacados
</h2>

<!-- =========================
     PRODUCTOS
========================= -->

<section class="products">

<!-- BARCELONA -->

<div class="card" data-name="barcelona">

<img src="Barca1.png">

<div class="card-content">

<h3>Barcelona 24/25</h3>

<div class="price">$799 MXN</div>

<div class="sizes">
<button class="size-btn active">S</button>
<button class="size-btn">M</button>
<button class="size-btn">L</button>
<button class="size-btn">XL</button>
</div>

<button
class="buy-btn"
onclick="addToCart(this,'Barcelona 24/25',799)"
>
Agregar al carrito
</button>

</div>
</div>

<!-- REAL MADRID -->

<div class="card" data-name="real madrid">

<img src="Real1.png">

<div class="card-content">

<h3>Real Madrid 24/25</h3>

<div class="price">$799 MXN</div>

<div class="sizes">
<button class="size-btn active">S</button>
<button class="size-btn">M</button>
<button class="size-btn">L</button>
<button class="size-btn">XL</button>
</div>

<button
class="buy-btn"
onclick="addToCart(this,'Real Madrid 24/25',799)"
>
Agregar al carrito
</button>

</div>
</div>

<!-- LIVERPOOL -->

<div class="card" data-name="liverpool">

<img src="r1.png">

<div class="card-content">

<h3>Liverpool 24/25</h3>

<div class="price">$799 MXN</div>

<div class="sizes">
<button class="size-btn active">S</button>
<button class="size-btn">M</button>
<button class="size-btn">L</button>
<button class="size-btn">XL</button>
</div>

<button
class="buy-btn"
onclick="addToCart(this,'Liverpool 24/25',799)"
>
Agregar al carrito
</button>

</div>
</div>

</section>

<!-- =========================
     PANEL CARRITO
========================= -->

<div class="cart-panel" id="cartPanel">

<h2>Tu carrito</h2>

<div id="cart-items"></div>

<div class="total" id="total">
Total: $0 MXN
</div>

<div class="cart-buttons">

<button class="clear-btn" onclick="clearCart()">
Vaciar carrito
</button>

<button class="whatsapp-btn" onclick="sendWhatsApp()">
Finalizar pedido por WhatsApp
</button>

</div>

</div>

<!-- =========================
     FOOTER
========================= -->

<footer>
© 2026 CAMISOVICH
</footer>

<!-- =========================
     JAVASCRIPT
========================= -->

<script>

/* =========================
   CARRITO
========================= */

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

/* =========================
   AGREGAR PRODUCTO
========================= */

function addToCart(button,name,price){

const card =
button.closest(".card");

const selectedSize =
card.querySelector(".size-btn.active").innerText;

const existingProduct =
cart.find(
item =>
item.name === name &&
item.size === selectedSize
);

if(existingProduct){

existingProduct.quantity++;

}else{

cart.push({
name,
price,
size:selectedSize,
quantity:1
});

}

updateCart();

}

/* =========================
   ACTUALIZAR CARRITO
========================= */

function updateCart(){

const cartItems =
document.getElementById("cart-items");

cartItems.innerHTML = "";

let total = 0;
let totalItems = 0;

cart.forEach((item,index)=>{

const subtotal =
item.price * item.quantity;

total += subtotal;

totalItems += item.quantity;

cartItems.innerHTML += `

<div class="cart-item">

<div class="cart-top">

<div>

<b>${item.name}</b><br>

Talla: ${item.size}<br>

$${item.price} MXN

</div>

<button
class="remove-btn"
onclick="removeFromCart(${index})"
>
🗑️
</button>

</div>

<div class="quantity-controls">

<button
class="qty-btn"
onclick="decreaseQuantity(${index})"
>
-
</button>

<span>
${item.quantity}
</span>

<button
class="qty-btn"
onclick="increaseQuantity(${index})"
>
+
</button>

</div>

<div style="margin-top:10px; color:#00ff88; font-weight:700;">

Subtotal: $${subtotal} MXN

</div>

</div>

`;

});

document.getElementById("total").innerText =
`Total: $${total} MXN`;

document.getElementById("cart-count").innerText =
totalItems;

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

}

/* =========================
   ELIMINAR
========================= */

function removeFromCart(index){

cart.splice(index,1);

updateCart();

}

/* =========================
   AUMENTAR
========================= */

function increaseQuantity(index){

cart[index].quantity++;

updateCart();

}

/* =========================
   DISMINUIR
========================= */

function decreaseQuantity(index){

if(cart[index].quantity > 1){

cart[index].quantity--;

}else{

cart.splice(index,1);

}

updateCart();

}

/* =========================
   VACIAR
========================= */

function clearCart(){

cart = [];

updateCart();

}

/* =========================
   ABRIR CARRITO
========================= */

function toggleCart(){

document
.getElementById("cartPanel")
.classList.toggle("active");

}

/* =========================
   WHATSAPP
========================= */

function sendWhatsApp(){

if(cart.length === 0){

alert("El carrito está vacío");

return;

}

let message =
"Hola, quiero pedir:%0A%0A";

let total = 0;

cart.forEach(item=>{

const subtotal =
item.price * item.quantity;

message +=
`• ${item.name} | Talla ${item.size} | x${item.quantity} | $${subtotal} MXN%0A`;

total += subtotal;

});

message += `%0ATotal: $${total} MXN`;

window.open(
`https://wa.me/5210000000000?text=${message}`,
'_blank'
);

}

/* =========================
   BUSCADOR
========================= */

const searchInput =
document.getElementById("searchInput");

searchInput.addEventListener("keyup", ()=>{

const value =
searchInput.value.toLowerCase();

const cards =
document.querySelectorAll(".card");

cards.forEach(card=>{

const name =
card.dataset.name.toLowerCase();

card.style.display =
name.includes(value)
? "block"
: "none";

});

});

/* =========================
   SELECCION TALLAS
========================= */

document.querySelectorAll(".sizes").forEach(container=>{

const buttons =
container.querySelectorAll(".size-btn");

buttons.forEach(button=>{

button.addEventListener("click", ()=>{

buttons.forEach(btn=>
btn.classList.remove("active")
);

button.classList.add("active");

});

});

});

/* =========================
   INICIAR
========================= */

updateCart();

</script>

</body>
</html>
